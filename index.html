<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Apex Media Network — full-stack media operation: production, talent representation, and distribution infrastructure for creators and brands.">
<title>Apex Media Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0a0a0c;
    --surface:#141518;
    --surface-2:#1b1c20;
    --border:#2a2b30;
    --border-soft:#202126;
    --text:#f1efe9;
    --text-dim:#9a9ca3;
    --text-faint:#5c5e66;
    --accent:#ff4b23;
    --accent-soft:rgba(255,75,35,0.14);
    --chrome:#c9cdd3;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Archivo',ui-sans-serif,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--accent);color:#0a0a0c;}

  .font-display{font-family:'Big Shoulders Display',ui-sans-serif,sans-serif; text-transform:uppercase;}
  .font-mono{font-family:'JetBrains Mono',ui-monospace,monospace;}

  .h-hero{font-weight:900; font-size:clamp(2.6rem,8vw,7.2rem); line-height:0.92; letter-spacing:-0.01em; text-wrap:balance;}
  .h-section{font-weight:800; font-size:clamp(2rem,5vw,3.6rem); line-height:1.02; text-wrap:balance;}
  .h-card{font-weight:800; font-size:clamp(1.4rem,2.4vw,2rem); line-height:1.08; text-wrap:balance;}
  .stat-num{font-weight:900; font-size:clamp(3rem,6.4vw,5.2rem); line-height:0.85; font-variant-numeric:tabular-nums;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-dim);}

  a{color:inherit; text-decoration:none;}
  a:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}

  /* faint broadcast test-pattern texture */
  .grain-field{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.05;
    background-image: repeating-linear-gradient(90deg, var(--chrome) 0px, var(--chrome) 1px, transparent 1px, transparent 96px);
  }

  .rec-dot{
    width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none;
    box-shadow:0 0 0 0 rgba(255,75,35,0.6);
    animation: recpulse 1.9s infinite;
  }
  @keyframes recpulse{
    0%{ box-shadow:0 0 0 0 rgba(255,75,35,0.55); }
    70%{ box-shadow:0 0 0 9px rgba(255,75,35,0); }
    100%{ box-shadow:0 0 0 0 rgba(255,75,35,0); }
  }

  .ticker-wrap{ overflow:hidden; white-space:nowrap; }
  .ticker-track{ display:inline-flex; width:max-content; animation: marquee 32s linear infinite; }
  @keyframes marquee{ from{ transform:translateX(0);} to{ transform:translateX(-50%);} }

  .case-card{ position:relative; transition: background-color .3s ease, border-color .3s ease; }
  .case-card::before, .case-card::after{
    content:''; position:absolute; width:20px; height:20px; opacity:0;
    transition: opacity .25s ease, transform .25s ease; pointer-events:none;
  }
  .case-card::before{ top:-1px; left:-1px; border-top:2px solid var(--accent); border-left:2px solid var(--accent); transform:translate(8px,8px); }
  .case-card::after{ bottom:-1px; right:-1px; border-bottom:2px solid var(--accent); border-right:2px solid var(--accent); transform:translate(-8px,-8px); }
  .case-card:hover::before, .case-card:hover::after{ opacity:1; transform:translate(0,0); }
  .case-card:hover{ border-color: var(--border); background:var(--surface-2); }

  .scanlines{
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 3px);
  }

  .btn-fill{ position:relative; overflow:hidden; z-index:0; }
  .btn-fill::before{
    content:''; position:absolute; inset:0; background:var(--accent); transform:translateX(-101%);
    transition: transform .32s cubic-bezier(.65,0,.35,1); z-index:-1;
  }
  .btn-fill:hover::before{ transform:translateX(0); }

  .nav-link{ position:relative; }
  .nav-link::after{ content:''; position:absolute; left:0; right:0; bottom:-4px; height:1px; background:var(--accent); transform:scaleX(0); transform-origin:left; transition:transform .25s ease; }
  .nav-link:hover::after{ transform:scaleX(1); }

  @media (prefers-reduced-motion: reduce){
    .ticker-track, .rec-dot{ animation:none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ---------------------------------------------------------------
   Icon set — minimalist stroke icons in the Lucide visual language
   (24x24, round caps/joins, currentColor). Hand-drawn for this
   sandbox since npm icon packages can't be imported here; drop-in
   replaceable with `lucide-react` imports in a real build.
----------------------------------------------------------------- */
const IconBase = ({ children, size = 20, className = "" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" className={className}>
    {children}
  </svg>
);
const ArrowUpRight = (p) => <IconBase {...p}><path d="M7 17 17 7"/><path d="M8 7h9v9"/></IconBase>;
const ArrowRight = (p) => <IconBase {...p}><path d="M4 12h15"/><path d="M13 6l6 6-6 6"/></IconBase>;
const ChevronDown = (p) => <IconBase {...p}><path d="M6 9l6 6 6-6"/></IconBase>;
const Mail = (p) => <IconBase {...p}><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3.5 6.5 12 13l8.5-6.5"/></IconBase>;
const Copy = (p) => <IconBase {...p}><rect x="9" y="9" width="12" height="12" rx="1.5"/><path d="M5 15V4.5A1.5 1.5 0 0 1 6.5 3H16"/></IconBase>;
const Check = (p) => <IconBase {...p}><path d="M4 12l6 6 10-12"/></IconBase>;
const Camera = (p) => <IconBase {...p}><rect x="3" y="7" width="14" height="11" rx="1.5"/><path d="M8 7l1.6-2.5h2.8L14 7"/><circle cx="10" cy="12.5" r="3"/><path d="M17.5 10.5 21 8.5v8l-3.5-2"/></IconBase>;
const Scissors = (p) => <IconBase {...p}><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><path d="M20 5 8 13"/><path d="M8 11 20 19"/></IconBase>;
const Layers = (p) => <IconBase {...p}><path d="M12 3l9 5-9 5-9-5 9-5Z"/><path d="M3 13l9 5 9-5"/></IconBase>;
const Radio = (p) => <IconBase {...p}><circle cx="12" cy="12" r="2.2"/><path d="M8.5 8.5a5 5 0 0 0 0 7"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M5.5 5.5a9.5 9.5 0 0 0 0 13"/><path d="M18.5 5.5a9.5 9.5 0 0 1 0 13"/></IconBase>;
const Monitor = (p) => <IconBase {...p}><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6"/><path d="M12 16v4"/></IconBase>;
const Users = (p) => <IconBase {...p}><circle cx="9" cy="8.5" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 7a3 3 0 0 1 0 6"/><path d="M21 20c0-2.7-1.7-5-4.2-5.7"/></IconBase>;
const TrendUp = (p) => <IconBase {...p}><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></IconBase>;
const Globe = (p) => <IconBase {...p}><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/></IconBase>;
const Menu = (p) => <IconBase {...p}><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></IconBase>;
const X = (p) => <IconBase {...p}><path d="M6 6l12 12"/><path d="M18 6 6 18"/></IconBase>;

/* ------------------------------- Data ------------------------------- */
const TICKER_ITEMS = [
  "INSTAGRAM","TIKTOK","YOUTUBE","SNAPCHAT","TWITCH","KICK",
  "MINERALS & RESOURCES","AI / TECH","CLIPSY.CLUB","NETFLIX"
];

const METRICS = [
  { num: "04", label: "Simultaneous Platforms", desc: "Instagram, TikTok, YouTube and Snapchat, multistreamed live to Twitch and Kick from a single rig." },
  { num: "02", label: "Network Verticals", desc: "Purpose-built clipping networks running Minerals / Mining / Resources and AI / Tech content at scale." },
  { num: "3×", label: "Daily Cadence", desc: "Three pieces of brand content published every day, across every platform, with no gaps in the feed." },
  { num: "01", label: "Netflix Placement", desc: "One Ultimatum Season 4 moment, engineered into an active Perfect Match casting pitch." },
];

const CASES = [
  {
    reel: "REEL 01", tag: "TALENT & CONTENT", icon: Users, size: "lg",
    title: "From Reality TV Villain to Full Media Operation",
    body: "A franchise-first ejection from Netflix's The Ultimatum Season 4 made our client the most talked-about name of the season. We turned the moment into infrastructure: real-time engagement across every comment section, on-set recording and asset pipelines for daily output, and a live pitch now in front of Kinetic Content's casting team for Perfect Match.",
    meta: ["Netflix", "The Ultimatum S4", "Perfect Match Pitch"],
  },
  {
    reel: "REEL 02", tag: "PLATFORM", icon: Layers, size: "md",
    title: "Everything Clipping, In One Place",
    body: "clipsy.club aggregates clipping campaigns from Whop, clipping.net and beyond into a single destination, funneling traffic into a Discord built to convert — the front door to a business built to run campaigns directly, not take a cut of someone else's.",
    meta: ["clipsy.club", "Discord Community", "Live"],
  },
  {
    reel: "REEL 03", tag: "DISTRIBUTION", icon: Scissors, size: "md",
    title: "A Clipping Network Built for Two Industries",
    body: "Multi-page clipping infrastructure spanning Minerals / Mining / Resources and AI / Tech, engineered with content-ratio strategy and cross-platform fingerprint evasion so distribution survives contact with the algorithm.",
    meta: ["Minerals & Resources", "AI / Tech", "Multi-Platform"],
  },
  {
    reel: "REEL 04", tag: "PRODUCTION", icon: Camera, size: "lg",
    title: "One Broadcast, Four Platforms, Zero Lag",
    body: "A production stack — Sony a7 V, SM7B and Rodecaster Pro, a DJI wireless mic, Restream and Streamlabs — built to simulcast the same broadcast to YouTube, Kick, Twitch and TikTok at once, on location or in studio.",
    meta: ["Multistream", "On-Location", "Studio"],
  },
];

/* ------------------------------ Sections ----------------------------- */
function Nav() {
  const [open, setOpen] = useState(false);
  const links = [
    { href: "#work", label: "Work" },
    { href: "#method", label: "Method" },
    { href: "#clipsy", label: "Clipsy" },
    { href: "#contact", label: "Contact" },
  ];
  return (
    <header className="fixed top-0 left-0 right-0 z-40 border-b" style={{borderColor:"var(--border-soft)", background:"rgba(10,10,12,0.82)", backdropFilter:"blur(10px)"}}>
      <div className="max-w-[1400px] mx-auto px-6 md:px-10 h-16 flex items-center justify-between">
        <a href="#top" className="flex items-center gap-2.5">
          <span className="rec-dot"></span>
          <span className="font-display text-xl tracking-tight">APX</span>
          <span className="font-mono text-[11px] hidden sm:inline" style={{color:"var(--text-faint)"}}>/ APEX MEDIA NETWORK</span>
        </a>
        <nav className="hidden md:flex items-center gap-8 font-mono text-xs" style={{letterSpacing:"0.06em"}}>
          {links.map(l => (
            <a key={l.href} href={l.href} className="nav-link uppercase" style={{color:"var(--text-dim)"}}>{l.label}</a>
          ))}
        </nav>
        <a href="#contact" className="btn-fill hidden md:inline-flex items-center gap-2 px-4 py-2 border font-mono text-xs uppercase" style={{borderColor:"var(--border)", letterSpacing:"0.06em"}}>
          Start a Project <ArrowUpRight size={14}/>
        </a>
        <button className="md:hidden" onClick={() => setOpen(v=>!v)} aria-label="Toggle menu">
          {open ? <X size={22}/> : <Menu size={22}/>}
        </button>
      </div>
      {open && (
        <div className="md:hidden border-t px-6 py-5 flex flex-col gap-4 font-mono text-sm uppercase" style={{borderColor:"var(--border-soft)", background:"var(--bg)"}}>
          {links.map(l => <a key={l.href} href={l.href} onClick={()=>setOpen(false)} style={{color:"var(--text-dim)"}}>{l.label}</a>)}
          <a href="#contact" onClick={()=>setOpen(false)} className="pt-2" style={{color:"var(--accent)"}}>Start a Project →</a>
        </div>
      )}
    </header>
  );
}

function Ticker() {
  const items = [...TICKER_ITEMS, ...TICKER_ITEMS];
  return (
    <div className="ticker-wrap border-y" style={{borderColor:"var(--border-soft)", background:"var(--surface)"}}>
      <div className="ticker-track py-3">
        {items.map((t, i) => (
          <span key={i} className="font-mono text-xs uppercase px-6 flex items-center gap-6" style={{color:"var(--text-faint)", letterSpacing:"0.1em"}}>
            {t} <span style={{color:"var(--accent)"}}>●</span>
          </span>
        ))}
      </div>
    </div>
  );
}

function Hero() {
  return (
    <section id="top" className="relative pt-40 pb-20 px-6 md:px-10 border-b" style={{borderColor:"var(--border-soft)"}}>
      <div className="max-w-[1400px] mx-auto">
        <div className="flex items-center gap-2 mb-8">
          <span className="rec-dot"></span>
          <span className="eyebrow">Multi-Vertical Media Network — Dorado Beach, PR</span>
        </div>
        <h1 className="font-display h-hero max-w-5xl">
          We build the machine <span style={{color:"var(--accent)"}}>behind</span> the moment.
        </h1>
        <div className="mt-10 grid md:grid-cols-12 gap-8 items-end">
          <p className="md:col-span-7 text-lg md:text-xl" style={{color:"var(--text-dim)"}}>
            Apex Media Network is a full-stack media operation — production, talent representation,
            and distribution infrastructure for creators and brands who need more than a single video.
            One story, engineered to reach every feed at once.
          </p>
          <div className="md:col-span-5 flex flex-wrap gap-4 md:justify-end">
            <a href="#work" className="btn-fill inline-flex items-center gap-2 px-6 py-3.5 font-mono text-xs uppercase" style={{background:"var(--accent)", color:"#0a0a0c", letterSpacing:"0.06em"}}>
              View Our Work <ArrowUpRight size={14}/>
            </a>
            <a href="#method" className="inline-flex items-center gap-2 px-6 py-3.5 border font-mono text-xs uppercase nav-link" style={{borderColor:"var(--border)", letterSpacing:"0.06em"}}>
              Our Method
            </a>
          </div>
        </div>
      </div>
    </section>
  );
}

function Metrics() {
  return (
    <section className="px-6 md:px-10 py-20 border-b" style={{borderColor:"var(--border-soft)"}}>
      <div className="max-w-[1400px] mx-auto grid sm:grid-cols-2 lg:grid-cols-4 gap-px" style={{background:"var(--border-soft)"}}>
        {METRICS.map((m, i) => (
          <div key={i} className="p-8 md:p-10" style={{background:"var(--bg)"}}>
            <div className="font-display stat-num" style={{color: i === 0 ? "var(--accent)" : "var(--text)"}}>{m.num}</div>
            <div className="eyebrow mt-4 mb-2">{m.label}</div>
            <p className="text-sm" style={{color:"var(--text-dim)"}}>{m.desc}</p>
          </div>
        ))}
      </div>
    </section>
  );
}

function MediaPlaceholder({ Icon, tone }) {
  return (
    <div className="scanlines relative h-48 md:h-56 border-b flex items-center justify-center overflow-hidden"
         style={{borderColor:"var(--border)", background:"linear-gradient(160deg, var(--surface-2), var(--bg))"}}>
      <Icon size={40} className="opacity-30" />
      <span className="absolute top-3 left-3 font-mono text-[10px] flex items-center gap-1.5" style={{color:"var(--text-faint)"}}>
        <span className="rec-dot"></span> REC
      </span>
      <span className="absolute bottom-3 right-3 font-mono text-[10px]" style={{color:"var(--text-faint)"}}>00:00:04:12</span>
    </div>
  );
}

function CaseCard({ c }) {
  const Icon = c.icon;
  const span = c.size === "lg" ? "lg:col-span-7" : "lg:col-span-5";
  return (
    <article className={`case-card border ${span}`} style={{borderColor:"var(--border-soft)"}}>
      <MediaPlaceholder Icon={Icon} />
      <div className="p-7 md:p-9">
        <div className="flex items-center justify-between mb-5 font-mono text-[11px] uppercase" style={{color:"var(--text-faint)", letterSpacing:"0.1em"}}>
          <span>{c.reel}</span>
          <span className="px-2.5 py-1 border" style={{borderColor:"var(--border)", color:"var(--accent)"}}>{c.tag}</span>
        </div>
        <h3 className="font-display h-card mb-4">{c.title}</h3>
        <p className="text-[15px] leading-relaxed mb-6" style={{color:"var(--text-dim)"}}>{c.body}</p>
        <div className="flex flex-wrap gap-x-4 gap-y-2 font-mono text-[11px] uppercase" style={{color:"var(--text-faint)", letterSpacing:"0.06em"}}>
          {c.meta.map((m, i) => (
            <span key={i} className="flex items-center gap-2">
              {i > 0 && <span style={{color:"var(--border)"}}>/</span>} {m}
            </span>
          ))}
        </div>
      </div>
    </article>
  );
}

function CaseStudies() {
  return (
    <section id="work" className="px-6 md:px-10 py-24 border-b" style={{borderColor:"var(--border-soft)"}}>
      <div className="max-w-[1400px] mx-auto">
        <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-6 mb-14">
          <div>
            <div className="eyebrow mb-4">Accomplishments — Selected Reels</div>
            <h2 className="font-display h-section">Work built to <span style={{color:"var(--accent)"}}>outlast</span> the algorithm.</h2>
          </div>
          <p className="max-w-sm text-sm" style={{color:"var(--text-dim)"}}>
            Four operations, one discipline: turn a single moment into a system that keeps producing after the moment fades.
          </p>
        </div>
        <div className="grid lg:grid-cols-12 gap-6">
          {CASES.map((c, i) => <CaseCard key={i} c={c} />)}
        </div>
      </div>
    </section>
  );
}

function Method() {
  const points = [
    { Icon: TrendUp, title: "Read it like a desk", body: "Retention curves, comment velocity, and platform fingerprinting get the same scrutiny a trading desk gives a position." },
    { Icon: Radio, title: "Distribution is the product", body: "A great clip that reaches one feed is a rounding error. We build the network the clip travels through." },
    { Icon: Globe, title: "Native to every platform", body: "The same story, re-engineered for how Instagram, TikTok, YouTube and Snapchat actually reward attention." },
  ];
  return (
    <section id="method" className="px-6 md:px-10 py-24 border-b" style={{borderColor:"var(--border-soft)"}}>
      <div className="max-w-[1400px] mx-auto grid lg:grid-cols-12 gap-14">
        <div className="lg:col-span-5">
          <div className="eyebrow mb-4">The Edge</div>
          <h2 className="font-display h-section mb-6">Built by an operator, not a marketing department.</h2>
          <p className="text-[15px] leading-relaxed" style={{color:"var(--text-dim)"}}>
            Apex Media is run the way a trading desk is run — every platform is a position, every post is a data point,
            and distribution is a system, not a stroke of luck. We came from finance, not film school, which is why we
            obsess over the numbers most media teams skip. Content is the product. Distribution is the edge.
          </p>
        </div>
        <div className="lg:col-span-7 grid sm:grid-cols-3 gap-px" style={{background:"var(--border-soft)"}}>
          {points.map((p, i) => (
            <div key={i} className="p-7" style={{background:"var(--bg)"}}>
              <p.Icon size={22} className="mb-5" style={{color:"var(--accent)"}} />
              <h4 className="font-display text-base mb-3 tracking-tight">{p.title}</h4>
              <p className="text-[13.5px] leading-relaxed" style={{color:"var(--text-dim)"}}>{p.body}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Clipsy() {
  return (
    <section id="clipsy" className="px-6 md:px-10 py-24 border-b" style={{borderColor:"var(--border-soft)"}}>
      <div className="max-w-[1400px] mx-auto border" style={{borderColor:"var(--border)"}}>
        <div className="grid lg:grid-cols-12">
          <div className="lg:col-span-7 p-9 md:p-14">
            <div className="eyebrow mb-5">Product — clipsy.club</div>
            <h2 className="font-display h-section mb-6">The Clipsy Ecosystem</h2>
            <p className="text-[15px] leading-relaxed mb-6" style={{color:"var(--text-dim)"}}>
              Raw footage isn't an asset until it's cut, tagged, and pushed to the platforms that reward it fastest.
              Clipsy is our answer at the infrastructure level: an aggregator that pulls clipping campaigns from
              Whop, clipping.net, and other sources into one destination — <em style={{color:"var(--text)", fontStyle:"normal"}}>"Everything clipping, in one place."</em> —
              then routes that traffic into a Discord built to keep clippers producing and brands coming back.
            </p>
            <div className="flex flex-wrap gap-3">
              {["Aggregation Layer","Discord Community","Reddit / X Growth","Brand Deal Funnel"].map((t,i) => (
                <span key={i} className="font-mono text-[11px] uppercase px-3 py-1.5 border" style={{borderColor:"var(--border)", color:"var(--text-dim)", letterSpacing:"0.06em"}}>{t}</span>
              ))}
            </div>
          </div>
          <div className="lg:col-span-5 border-t lg:border-t-0 lg:border-l p-9 md:p-14 flex flex-col justify-center" style={{borderColor:"var(--border)", background:"var(--surface)"}}>
            <Scissors size={30} style={{color:"var(--accent)"}} className="mb-6" />
            <div className="font-mono text-xs uppercase mb-2" style={{color:"var(--text-faint)", letterSpacing:"0.1em"}}>Status</div>
            <div className="flex items-center gap-2 mb-6">
              <span className="rec-dot"></span>
              <span className="font-display text-lg tracking-tight">LIVE AT CLIPSY.CLUB</span>
            </div>
            <p className="text-[13.5px] leading-relaxed" style={{color:"var(--text-dim)"}}>
              Built to feel distinct from clipping.net's production polish while matching it — a front door
              designed to convert visitors into a community, not just a bounce.
            </p>
          </div>
        </div>
      </div>
    </section>
  );
}

function Footer() {
  const [copied, setCopied] = useState(false);
  const email = "hello@apexmedia.co";
  const copyEmail = async () => {
    try { await navigator.clipboard.writeText(email); } catch (e) {}
    setCopied(true);
    setTimeout(() => setCopied(false), 1800);
  };
  return (
    <footer id="contact" className="px-6 md:px-10 pt-24 pb-10">
      <div className="max-w-[1400px] mx-auto">
        <div className="grid lg:grid-cols-12 gap-10 items-end pb-16 border-b" style={{borderColor:"var(--border-soft)"}}>
          <div className="lg:col-span-8">
            <div className="eyebrow mb-5">Let's Talk</div>
            <h2 className="font-display h-hero" style={{fontSize:"clamp(2.4rem,6.5vw,5.4rem)"}}>
              Let's build <span style={{color:"var(--accent)"}}>your</span> feed.
            </h2>
          </div>
          <div className="lg:col-span-4 flex flex-col gap-4 lg:items-end">
            <button onClick={copyEmail} className="btn-fill w-full lg:w-auto inline-flex items-center justify-center gap-3 px-6 py-4 font-mono text-sm" style={{background:"var(--accent)", color:"#0a0a0c"}}>
              {copied ? <><Check size={16}/> Copied</> : <><Mail size={16}/> {email}</>}
            </button>
            <a href={`mailto:${email}`} className="inline-flex items-center gap-2 font-mono text-xs uppercase nav-link" style={{color:"var(--text-dim)", letterSpacing:"0.06em"}}>
              or open your mail app <ArrowUpRight size={13}/>
            </a>
          </div>
        </div>
        <div className="pt-8 flex flex-col md:flex-row gap-4 md:items-center md:justify-between font-mono text-[11px] uppercase" style={{color:"var(--text-faint)", letterSpacing:"0.08em"}}>
          <div className="flex items-center gap-2">
            <span className="rec-dot"></span> Apex Media Network — Dorado Beach, Puerto Rico
          </div>
          <div className="flex gap-6">
            <span>© 2026 APX</span>
            <a href="#top" className="nav-link">Back to Top ↑</a>
          </div>
        </div>
      </div>
    </footer>
  );
}

function App() {
  return (
    <div className="relative z-10">
      <div className="grain-field"></div>
      <Nav />
      <Hero />
      <Ticker />
      <Metrics />
      <CaseStudies />
      <Method />
      <Clipsy />
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
